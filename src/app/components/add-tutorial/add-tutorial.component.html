<div class="submit-form tm-card">
  @if (!submitted) {
  <h4 class="tm-section-title">Add Tutorial</h4>
  <p class="tm-subtitle mb-4">Give your tutorial a title and a description</p>

  <div class="form-group">
    <label class="tm-label" for="title">Title</label>
    <input
      type="text"
      class="form-control"
      id="title"
      required
      [(ngModel)]="tutorial.title"
      name="title"
    />
  </div>

  <div class="form-group">
    <label class="tm-label" for="description">Description</label>
    <input
      class="form-control"
      id="description"
      required
      [(ngModel)]="tutorial.description"
      name="description"
    />
  </div>

  <div class="form-actions">
    <button (click)="saveTutorial()" class="tm-btn tm-btn-primary">
      Submit
    </button>
  </div>
  } @else {
  <div class="alert alert-success" role="alert">
    Tutorial was submitted successfully!
  </div>
  <div class="form-actions">
    <button class="tm-btn tm-btn-primary" (click)="newTutorial()">
      Add another
    </button>
  </div>
  }
</div>
